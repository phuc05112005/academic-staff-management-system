<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Hệ Thống Quản Lý Cán Bộ - Giảng Viên</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;

      background: linear-gradient(-45deg, #00c6ff, #0072ff, #c8a7e7, #5eeea8);
      background-size: 400% 400%;
      animation: gradientBG 30s ease infinite;
    }

    .box {
      position: relative;
      width: 90%;
      max-width: 720px;
      padding: 50px 40px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      box-shadow: 0 12px 45px rgba(0,0,0,0.45);
      text-align: center;
      animation: fadeInZoom 1s ease-out;
      overflow: hidden;
    }

    .box::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg,
        rgba(255,0,255,0.5),
        rgba(0,255,255,0.5),
        rgba(255,255,0,0.5),
        rgba(255,0,0,0.5));
      background-size: 400% 400%;
      z-index: -1;
      filter: blur(8px);
      animation: glow 20s linear infinite;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 15px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    .btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      padding: 14px 36px;
      font-size: 18px;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: bold;
      transition: 0.3s;
      display: inline-block;
      box-shadow: 0 8px 25px rgb(247, 243, 3);
      cursor: pointer;
    }

    .btn:hover {
      background: linear-gradient(135deg, #069eff, #005ecc);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 35px rgba(255, 149, 0, 0.55);
    }

    /* Keyframes */

    @keyframes fadeInZoom {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

  </style>

</head>
<body>

  <div class="box">
    <img class="logo" src="https://tqai.hcmunre.edu.vn/wp-content/uploads/2020/11/logo-truong-TV-40cm.png" alt="Logo trường">

    <h1>Xin chào</h1>
    <p>Hệ thống quản lý cán bộ — giảng viên của trường học</p>

    <button class="btn" onclick="openLogin()">🔐 Đăng nhập hệ thống</button>
  </div>

  <div id="loginModal" style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000;">
    <form class="login-box" th:action="@{/login}" method="post" style="
         width:90%; max-width:380px;
         background: rgba(255, 255, 255, 0.12);
         backdrop-filter: blur(8px);
         border-radius:20px;
         padding:40px 35px;
         box-shadow: 0 8px 25px rgba(0,0,0,0.5);
         color:white;
         text-align:left;
         position: relative;">
      <span style="position:absolute; top:10px; right:12px; font-size:26px; cursor:pointer;" onclick="closeLogin()">✖</span>
      <h2 style="text-align:center; margin-bottom:25px; text-shadow:2px 2px 5px rgba(0,0,0,0.4);">Đăng nhập hệ thống</h2>

      <label>Tên đăng nhập:</label>
      <input type="text" name="username" placeholder="Nhập tên đăng nhập" required style="width:100%; padding:12px; margin-bottom:18px; border:none; border-radius:10px; background: rgba(255,255,255,0.85); font-size:16px;">

      <label>Mật khẩu:</label>
      <div style="position:relative; margin-bottom:20px;">
        <input type="password" name="password" placeholder="Nhập mật khẩu" required id="pwd" style="width:100%; padding:12px; border:none; border-radius:10px; background: rgba(255,255,255,0.85); font-size:16px;">
        <span onclick="togglePwd()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:20px; color:#333;">&#128065;</span>
      </div>

      <button type="submit" style="width:100%; padding:12px; border:none; border-radius:12px; background:#00c6ff; color:white; font-size:18px; font-weight:bold; cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.3); transition:0.3s;">
        Đăng nhập
      </button>
    </form>
  </div>

  <script>
    function openLogin() {
      const m = document.getElementById('loginModal');
      m.style.display = 'flex';
    }
    function closeLogin() {
      const m = document.getElementById('loginModal');
      m.style.display = 'none';
    }
    function togglePwd() {
      const p = document.getElementById('pwd');
      p.type = p.type === 'password' ? 'text' : 'password';
    }
  </script>

</body>
</html>
