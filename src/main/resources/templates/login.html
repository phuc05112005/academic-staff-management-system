<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;

            /* Gradient nền chuyển động đẹp */
            background: linear-gradient(-45deg, #00c6ff, #0072ff, #c8a7e7, #5eeea8);
            background-size: 400% 400%;
            animation: gradientBG 30s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ---- LOGIN BOX (Glass UI nâng cấp + Glow) ---- */
        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 45px 38px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            border: 1.5px solid rgba(255,255,255,0.25);
            box-shadow:
                0 12px 45px rgba(0,0,0,0.45),
                0 0 25px rgba(255,255,255,0.08) inset;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease-out;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg,
                rgba(255,0,255,0.5),
                rgba(0,255,255,0.5),
                rgba(255,255,0,0.5),
                rgba(255,0,0,0.5));
            background-size: 400% 400%;
            z-index: -1;
            filter: blur(8px);
            animation: glow 20s linear infinite;
            border-radius: 25px;
        }

        @keyframes glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-box h2 {
            font-size: 30px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 600;
            color: #f0f0f0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 45px 12px 15px;
            margin-bottom: 18px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.85);
            font-size: 16px;
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-85%);
            cursor: pointer;
            font-size: 20px;
            color: #444;
            transition: 0.25s;
        }

        .toggle-password:hover {
            transform: translateY(-50%) scale(1.15);
            color: #2575fc;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(247, 243, 3,0.6);
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 35px rgba(255, 149, 0, 0.55);
        }

        .error {
            margin-top: 15px;
            color: #ffb3b3;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Đăng nhập hệ thống</h2>

    <form th:action="@{/login}" method="post">

        <label>Tên đăng nhập:</label>
        <input type="text" name="username" placeholder="Nhập tên đăng nhập" required />

        <label>Mật khẩu:</label>
        <div class="password-container">
            <input type="password" name="password" placeholder="Nhập mật khẩu" required id="password" />
            <span class="toggle-password" onclick="togglePassword()">&#128065;</span>
        </div>

        <button type="submit" class="btn-login">Đăng nhập</button>

        <div th:if="${param.error}">
            <p class="error">❌ Sai tên đăng nhập hoặc mật khẩu.</p>
        </div>

    </form>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eye = document.querySelector('.toggle-password');

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eye.style.color = "#2575fc";
        } else {
            passwordInput.type = "password";
            eye.style.color = "#444";
        }
    }
</script>

</body>
</html>
