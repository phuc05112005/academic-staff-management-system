<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Quản Lý Khoa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 40px;
            color: #333;

            /* Gradient chuyển màu động */
            background: linear-gradient(-45deg, #00c6ff, #0072ff, #c8a7e7, #5eeea8);
            background-size: 400% 400%;
            animation: gradientBG 30s ease infinite;
        }

        /* Keyframes cho gradient động */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #007bff, #0056b3);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 28px; text-shadow: 2px 2px 5px rgba(0,0,0,0.4); }

        .navbar {
            background: #343a40;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .navbar a:hover, .navbar a.active {
            background: #007bff;
            transform: translateY(-2px);
        }

        .top-bar {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .user-info { font-weight: bold; color: #007bff; }
        .logout-btn {
            background: #555555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .logout-btn:hover { background: #6c6c6c; transform: translateY(-2px); }

        .btn { padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; margin: 5px; transition: all 0.3s; }
        .btn-add { background: #28a745; color: white; } .btn-add:hover { background: #218838; }
        .btn-edit { background: #ffc107; color: black; } .btn-edit:hover { background: #e0a800; }
        .btn-delete { background: #dc3545; color: white; } .btn-delete:hover { background: #c82333; }

        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th {
            background: #007bff;
            color: white;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
        }
        td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #dee2e6;
        }
        tr:hover { background: #f8f9fa; }

        .alert { padding: 15px; margin: 20px; border-radius: 8px; font-weight: bold; text-align: center; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>HỆ THỐNG QUẢN LÝ CÁN BỘ - GIẢNG VIÊN</h1>
    </div>

    <!-- NAVBAR -->
    <div class="navbar">
        <a th:href="@{/canbo}">Danh sách cán bộ</a>
        <a th:href="@{/luong}">Quản lý lương</a>
        <a th:href="@{/chucvu}">Chức vụ</a>
        <a th:href="@{/khoa}" class="active">Khoa</a>
        <a th:href="@{/bomon}">Bộ môn</a>
        <a th:href="@{/hocvi}">Học vị</a>
        <a th:href="@{/hopdong}">Hợp đồng</a>
        <a th:href="@{/taikhoan}">Tài khoản</a>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="user-info">
            Xin chào: <strong sec:authentication="name"></strong>
        </div>

        <form th:action="@{/logout}" method="post" onsubmit="return confirm('Bạn chắc chắn muốn thoát?');">
            <button type="submit" class="logout-btn">Đăng xuất</button>
        </form>
    </div>

    <!-- ALERT -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- BUTTON ADD -->
    <div style="padding: 0 20px 10px; text-align: right;">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/khoa/add}" class="btn btn-add">+ Thêm Khoa</a>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
        <tr>
            <th>Mã Khoa</th>
            <th>Khoa</th>
            <th>Địa Chỉ</th>
            <th>Số Điện Thoại</th>
            <th>Thao tác</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="k : ${list}">
            <td th:text="${k.maKhoa}"></td>
            <td th:text="${k.tenKhoa}"></td>
            <td th:text="${k.diaChi}"></td>
            <td th:text="${k.soDienThoai}"></td>
            <td>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{'/khoa/edit/' + ${k.maKhoa}}" class="btn btn-edit">✏ Sửa</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{'/khoa/delete/' + ${k.maKhoa}}"
                   onclick="return confirm('Bạn chắc chắn muốn xóa?');"
                   class="btn btn-delete">🗑 Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
