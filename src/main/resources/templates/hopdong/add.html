<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Hợp Đồng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2 class="text-center mb-4">Thêm Mới Hợp Đồng</h2>

    <!-- LƯU Ý: dùng th:object="${hopDong}" (phù hợp với model attribute trong controller) -->
    <form th:action="@{/hopdong/add}" th:object="${hopDong}" method="post" class="card p-4 shadow">

        <!-- Cán bộ -->
        <div class="mb-3">
            <label class="form-label">Cán bộ</label>
            <select class="form-select" th:field="*{canBo.maCB}" required>
                <option value="">-- Chọn cán bộ --</option>
                <option th:each="cb : ${listCanBo}"
                        th:value="${cb.maCB}"
                        th:text="${cb.hoTen}">
                </option>
            </select>
        </div>

        <!-- Loại hợp đồng -->
        <div class="mb-3">
            <label class="form-label">Loại hợp đồng</label>
            <select class="form-select" th:field="*{loaiHopDong}" required>
                <option value="">-- Chọn loại hợp đồng --</option>
                <option value="Hợp đồng xác định thời hạn">Hợp đồng xác định thời hạn</option>
                <option value="Hợp đồng không xác định thời hạn">HĐ không xác định thời hạn</option>
                <option value="Hợp đồng thử việc">Hợp đồng thử việc</option>
                <option value="Hợp đồng giảng dạy">Hợp đồng giảng dạy</option>
                <option value="Hợp đồng khoán việc">Hợp đồng khoán việc</option>
                <option value="Hợp đồng học việc">Hợp đồng học việc</option>
            </select>
        </div>

        <!-- Ngày bắt đầu -->
        <div class="mb-3">
            <label class="form-label">Ngày bắt đầu</label>
            <input type="date" class="form-control" th:field="*{ngayBatDau}" required>
        </div>

        <!-- Ngày kết thúc -->
        <div class="mb-3">
            <label class="form-label">Ngày kết thúc</label>
            <input type="date" class="form-control" th:field="*{ngayKetThuc}">
        </div>

        <!-- Mức lương -->
        <div class="mb-3">
            <label class="form-label">Mức lương cơ bản</label>
            <input type="number" class="form-control" th:field="*{mucLuongCoBan}" step="0.01" required>
        </div>

        <!-- Phụ cấp -->
        <div class="mb-3">
            <label class="form-label">Phụ cấp</label>
            <input type="number" class="form-control" th:field="*{phuCap}" step="0.01">
        </div>

        <!-- Buttons -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success px-4">Thêm</button>
            <a th:href="@{/hopdong}" class="btn btn-secondary px-4">Hủy</a>
        </div>

    </form>

</body>
</html>
