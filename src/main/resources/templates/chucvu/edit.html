<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Chức Vụ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2 class="text-center mb-4">Chỉnh Sửa Chức Vụ</h2>

    <form th:action="@{/chucvu/edit}" th:object="${chucvu}" method="post" class="card p-4 shadow">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{maChucVu}">

        <!-- Tên Chức Vụ -->
        <div class="mb-3">
            <label for="tenChucVu" class="form-label">Tên Chức Vụ</label>
            <input type="text" id="tenChucVu" class="form-control" th:field="*{tenChucVu}" required>
        </div>

        <!-- Buttons -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-4">Lưu thay đổi</button>
            <a th:href="@{/chucvu}" class="btn btn-secondary px-4">Hủy</a>
        </div>

    </form>

</body>
</html>
