<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Chức Vụ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2 class="text-center mb-4">Thêm Mới Chức Vụ</h2>

    <form th:action="@{/chucvu/add}" th:object="${chucvu}" method="post" class="card p-4 shadow">

        <!-- Tên Chức Vụ -->
        <div class="mb-3">
            <label for="tenChucVu" class="form-label">Tên Chức Vụ</label>
            <input type="text" id="tenChucVu" class="form-control" th:field="*{tenChucVu}" placeholder="Nhập tên chức vụ" required>
        </div>

        <!-- Buttons -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success px-4">Thêm</button>
            <a th:href="@{/chucvu}" class="btn btn-secondary px-4">Hủy</a>
        </div>

    </form>

</body>
</html>
