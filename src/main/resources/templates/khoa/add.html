<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Khoa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2 class="text-center mb-4">Thêm Mới Khoa</h2>

    <form th:action="@{/khoa/add}" th:object="${khoa}" method="post" class="card p-4 shadow">

        <!-- Tên Khoa -->
        <div class="mb-3">
            <label for="tenKhoa" class="form-label">Tên Khoa</label>
            <input type="text" id="tenKhoa" class="form-control" th:field="*{tenKhoa}" placeholder="Nhập tên khoa" required>
        </div>

        <!-- Địa Chỉ -->
        <div class="mb-3">
            <label for="diaChi" class="form-label">Địa Chỉ</label>
            <input type="text" id="diaChi" class="form-control" th:field="*{diaChi}" placeholder="Nhập địa chỉ (nếu có)">
        </div>

        <!-- Số Điện Thoại -->
        <div class="mb-3">
            <label for="soDienThoai" class="form-label">Số Điện Thoại</label>
            <input type="text" id="soDienThoai" class="form-control" th:field="*{soDienThoai}" placeholder="Nhập số điện thoại (nếu có)">
        </div>

        <!-- Buttons -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success px-4">Thêm</button>
            <a th:href="@{/khoa}" class="btn btn-secondary px-4">Hủy</a>
        </div>

    </form>

</body>
</html>
