<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Hợp Đồng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2 class="text-center mb-4">Sửa Thông Tin Hợp Đồng</h2>

    <form th:action="@{/hopdong/edit}" th:object="${hopDong}" method="post" class="card p-4 shadow">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{maHD}">

        <!-- Cán bộ -->
        <div class="mb-3">
            <label class="form-label">Cán bộ</label>
            <select class="form-select" th:field="*{canBo.maCB}" required>
                <option value="">-- Chọn cán bộ --</option>
                <option th:each="cb : ${listCanBo}"
                        th:value="${cb.maCB}"
                        th:selected="${cb.maCB == hopDong.canBo.maCB}"
                        th:text="${cb.hoTen}">
                </option>
            </select>
        </div>

        <!-- Loại hợp đồng -->
        <div class="mb-3">
            <label class="form-label">Loại hợp đồng</label>
            <select class="form-select" th:field="*{loaiHopDong}" required>
                <option value="">-- Chọn loại hợp đồng --</option>

                <option value="Hợp đồng xác định thời hạn">Hợp đồng thời hạn</option>
                <option value="Hợp đồng không xác định thời hạn">Hợp đồng không thời hạn</option>
                <option value="Hợp đồng thử việc">Hợp đồng thử việc</option>
                <option value="Hợp đồng giảng dạy">Hợp đồng giảng dạy</option>
                <option value="Hợp đồng khoán việc">Hợp đồng khoán việc</option>
                <option value="Hợp đồng học việc">Hợp đồng học việc</option>
            </select>
        </div>

        <!-- Ngày bắt đầu -->
        <div class="mb-3">
            <label class="form-label">Ngày bắt đầu</label>
            <input type="date" class="form-control"
                th:field="*{ngayBatDau}"
                th:value="${#temporals.format(hopDong.ngayBatDau, 'yyyy-MM-dd')}" 
                required>
        </div>

        <!-- Ngày kết thúc -->
        <div class="mb-3">
            <label class="form-label">Ngày kết thúc</label>
            <input type="date" class="form-control"
                th:field="*{ngayKetThuc}"
                th:value="${hopDong.ngayKetThuc != null ? #temporals.format(hopDong.ngayKetThuc, 'yyyy-MM-dd') : ''}">
        </div>


        <!-- Mức lương -->
        <div class="mb-3">
            <label class="form-label">Mức lương cơ bản</label>
            <input type="number" class="form-control" th:field="*{mucLuongCoBan}" step="0.01" required>
        </div>

        <!-- Phụ cấp -->
        <div class="mb-3">
            <label class="form-label">Phụ cấp</label>
            <input type="number" class="form-control" th:field="*{phuCap}" step="0.01">
        </div>

        <!-- Button -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-4">Lưu thay đổi</button>
            <a th:href="@{/hopdong}" class="btn btn-secondary px-4">Hủy</a>
        </div>

    </form>

</body>
</html>
