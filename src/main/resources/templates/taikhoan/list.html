<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Quản Lý Tài Khoản</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 40px;
            color: #333;
            background: linear-gradient(-45deg, #00c6ff, #0072ff, #c8a7e7, #5eeea8);
            background-size: 400% 400%;
            animation: gradientBG 30s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #007bff, #0056b3);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 28px; text-shadow: 2px 2px 5px rgba(0,0,0,0.4); }

        .navbar {
            background: #343a40;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .navbar a {
            color: white; text-decoration: none; font-weight: bold;
            padding: 8px 16px; border-radius: 5px; transition: all 0.3s;
        }
        .navbar a:hover, .navbar a.active { background: #007bff; transform: translateY(-2px); }

        .top-bar {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .user-info { font-weight: bold; color: #007bff; }
        .logout-btn {
            background: #555555; color: white; border: none;
            padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: all 0.3s;
        }
        .logout-btn:hover { background: #6c6c6c; transform: translateY(-2px); }

        .btn { padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; margin: 5px; transition: all 0.3s; }
        .btn-add { background: #28a745; color: white; } .btn-add:hover { background: #218838; }
        .btn-edit { background: #ffc107; color: black; } .btn-edit:hover { background: #e0a800; }
        .btn-delete { background: #dc3545; color: white; } .btn-delete:hover { background: #c82333; }

        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th { background: #007bff; color: white; padding: 15px 10px; text-align: center; font-weight: bold; }
        td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #dee2e6; }
        tr:hover { background: #f8f9fa; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .pagination a {
            padding: 8px 14px;
            background: #007bff;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .pagination a:hover { background: #0056b3; }
        .pagination span { font-weight: bold; }

        .alert { padding: 15px; margin: 20px; border-radius: 8px; font-weight: bold; text-align: center; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* CSS cho form tìm kiếm */
        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding: 10px 20px;
            background: #f1f1f1;
            border-radius: 10px;
        }
        .search-form input[type="text"] {
            flex: 1 1 200px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .search-form button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-form button:hover { background: #0056b3; }
        .search-form a {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid #dc3545;
            color: #dc3545;
            transition: all 0.3s;
        }
        .search-form a:hover { background: #dc3545; color: white; }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>HỆ THỐNG QUẢN LÝ CÁN BỘ - GIẢNG VIÊN</h1>
    </div>

    <!-- NAVBAR -->
    <div class="navbar">
        <a th:href="@{/canbo}">Danh sách cán bộ</a>
        <a th:href="@{/luong}">Quản lý lương</a>
        <a th:href="@{/chucvu}">Chức vụ</a>
        <a th:href="@{/khoa}">Khoa</a>
        <a th:href="@{/bomon}">Bộ môn</a>
        <a th:href="@{/hocvi}">Học vị</a>
        <a th:href="@{/hopdong}">Hợp đồng</a>
        <a th:href="@{/taikhoan}" class="active">Tài khoản</a>
    </div>

    <!-- USER TOP BAR -->
    <div class="top-bar">
        <div class="user-info">Xin chào: <strong sec:authentication="name"></strong></div>
        <form th:action="@{/logout}" method="post" onsubmit="return confirm('Bạn chắc chắn muốn thoát?');">
            <button type="submit" class="logout-btn">Đăng xuất</button>
        </form>
    </div>

    <!-- ALERT -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- NÚT THÊM -->
    <div style="padding: 0 20px 10px; text-align: right;">
        <a th:href="@{/taikhoan/add}" class="btn btn-add" sec:authorize="hasRole('ADMIN')">+ Thêm Tài Khoản</a>
    </div>
    <div class="alert alert-success" sec:authorize="hasRole('ADMIN')">
        Số lượng tài khoản: 
        <b th:text="${totalTaiKhoan}"></b>
    </div>
    <!-- FORM TÌM KIẾM -->
    <form th:action="@{/taikhoan/search}" method="get" class="search-form">
        <input type="text" name="username" th:value="${username}" placeholder="Tìm theo tên đăng nhập hoặc tên cán bộ">
        <button type="submit">Tìm kiếm</button>
        <a th:if="${username != null && username != ''}" th:href="@{/taikhoan}">Xóa bộ lọc</a>
    </form>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Tên đăng nhập</th>
                <th>Tên cán bộ</th>
                <th>Vai trò</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tk : ${list}">
                <td th:text="${tk.tenDangNhap}"></td>
                <td th:text="${tk.canBo != null ? tk.canBo.hoTen : '—'}"></td>
                <td th:text="${tk.vaiTro}"></td>
                <td>
                    <a th:href="@{'/taikhoan/edit/' + ${tk.tenDangNhap}}" 
                        class="btn btn-edit" >
                        ✏ Sửa
                        </a>

                    <a sec:authorize="hasRole('ADMIN')" 
                        th:href="@{'/taikhoan/delete/' + ${tk.tenDangNhap}}" 
                        class="btn btn-delete"
                        onclick="return confirm('Xóa tài khoản này?');" 
                        title="Xóa tài khoản">🗑 Xóa</a>

                </td>
            </tr>
        </tbody>
    </table>

    <!-- PHÂN TRANG -->
    <div class="pagination">
        <a th:if="${page != null and page.hasPrevious()}" th:href="@{/taikhoan(page=${page.number - 1})}">« Trước</a>
        <span th:text="'Trang ' + ${page.number + 1} + ' / ' + ${page.totalPages}"></span>
        <a th:if="${page != null and page.hasNext()}" th:href="@{/taikhoan(page=${page.number + 1})}">Sau »</a>
    </div>

</div>
</body>
</html>
