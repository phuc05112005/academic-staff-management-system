<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Học Vị</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2 class="text-center mb-4">Chỉnh Sửa Học Vị</h2>

    <form th:action="@{/hocvi/edit}" th:object="${hocVi}" method="post" class="card p-4 shadow">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{maHocVi}">

        <!-- Tên học vị -->
        <div class="mb-3">
            <label for="tenHocVi" class="form-label">Tên học vị</label>
            <input type="text" id="tenHocVi" class="form-control" th:field="*{tenHocVi}" required>
        </div>

        <!-- Buttons -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-4">Lưu thay đổi</button>
            <a th:href="@{/hocvi}" class="btn btn-secondary px-4">Hủy</a>
        </div>

    </form>

</body>
</html>
