<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h3 class="mb-4">Sửa Tài Khoản</h3>

    <!-- action update -->
    <form th:action="@{/taikhoan/update}" th:object="${taiKhoan}" method="post">

        <!-- CÁN BỘ -->
        <div class="mb-3">
            <label class="form-label">Cán bộ</label>
            <select class="form-select"
                    name="canBoId"
                    th:disabled="${!isAdmin}">
                <option value="">-- Chọn cán bộ --</option>
                <option th:each="cb : ${canBoList}"
                        th:value="${cb.maCB}"
                        th:text="${cb.hoTen}"
                        th:selected="${cb.maCB == taiKhoan.canBo.maCB}">
                </option>
            </select>
        </div>
        <!-- USERNAME -->
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input type="text"
                   class="form-control"
                   th:field="*{tenDangNhap}" th:disabled="${!isAdmin}">
        </div>

        <!-- MẬT KHẨU -->
        <div class="mb-3">
            <label class="form-label">Mật khẩu mới</label>
            <input type="password"
                   class="form-control"
                   th:field="*{matKhau}"
                   placeholder="Nhập mật khẩu mới (để trống nếu không đổi)">
        </div>

        <!-- ROLE -->
        <div class="mb-3">
            <label class="form-label">Quyền</label>

            <select class="form-select"
                    th:field="*{vaiTro}"
                    th:disabled="${!isAdmin}">

                <option th:each="r : ${listRoles}"
                        th:value="${r}"
                        th:text="${r}">
                </option>

            </select>
        </div>

        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <a th:href="@{/taikhoan}" class="btn btn-secondary">Quay lại</a>

    </form>
</div>

</body>
</html>
